name: Deploy server

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    # без секретов шаг молча пропускается, чтобы не красить CI
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: gate
        env:
          HOST: ${{ secrets.SSH_HOST }}
          DOMAIN: ${{ secrets.API_DOMAIN }}
        run: |
          if [ -z "$HOST" ]; then
            echo "SSH_HOST не задан — деплой пропущен"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$DOMAIN" ]; then
            echo "API_DOMAIN не задан — HTTPS-проверка пропущена"
            echo "has_domain=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_domain=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload sources
        if: steps.gate.outputs.ready == 'true'
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude .env \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            server/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/max-upgrader-server/"

      - name: Build and restart
        if: steps.gate.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "API_DOMAIN='${{ secrets.API_DOMAIN }}' bash -s" <<'REMOTE'
          set -e
          cd ~/max-upgrader-server
          # секреты живут только на сервере, в репозиторий не попадают
          if [ ! -f .env ]; then
            echo "DB_PASSWORD=$(openssl rand -hex 24)" > .env
            echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          fi
          # домен приходит из секрета репозитория и перезаписывается на каждом деплое
          grep -v -e '^API_DOMAIN=' .env > .env.next || true
          echo "API_DOMAIN=${API_DOMAIN}" >> .env.next
          # страховка: не подменяем .env, если пропали сгенерированные секреты
          if grep -q '^DB_PASSWORD=' .env.next && grep -q '^JWT_SECRET=' .env.next; then
            mv .env.next .env
          else
            echo "не нашёл DB_PASSWORD/JWT_SECRET в новом .env — оставляю старый"
            rm -f .env.next
            exit 1
          fi
          if [ -n "${API_DOMAIN}" ]; then
            sudo docker compose --profile https up -d --build
          else
            # без домена Caddy не нужен — профиль https просто не включаем
            echo "API_DOMAIN не задан — HTTPS-фронт пропущен"
            sudo docker compose up -d --build
          fi
          sudo docker compose --profile https ps
          REMOTE

      - name: Smoke check
        if: steps.gate.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 3; done; exit 1'

      - name: Smoke check over HTTPS
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.has_domain == 'true'
        env:
          DOMAIN: ${{ secrets.API_DOMAIN }}
        run: |
          # первый сертификат Let's Encrypt выписывается до минуты
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/health"; then exit 0; fi
            sleep 5
          done
          echo "HTTPS не поднялся — смотри: sudo docker compose logs caddy"
          exit 1
