name: Build APK & EXE

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v1.1.0). Пусто — релиз не публикуется.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK
        run: |
          echo "SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        env:
          # адрес сервера зашивается в сборку; без секрета приложение
          # остаётся полностью офлайновым, как раньше
          VITE_API_URL: ${{ secrets.API_DOMAIN && format('https://{0}', secrets.API_DOMAIN) || '' }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<PROPS
          storeFile=../release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          VER=$(node -p "require('./package.json').version")
          # отладочная подпись отличается от релизной, поэтому помечаем имя файла:
          # такой APK не встанет поверх релизного, его надо ставить с нуля
          SUFFIX=$([ -f android/keystore.properties ] && echo "" || echo "-debug")
          find android/app/build/outputs/apk -name '*.apk' \
            -exec cp {} "out/MAX-Upgrader-$VER$SUFFIX.apk" \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MAX-Upgrader-apk
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        env:
          # адрес сервера зашивается в сборку; без секрета приложение
          # остаётся полностью офлайновым, как раньше
          VITE_API_URL: ${{ secrets.API_DOMAIN && format('https://{0}', secrets.API_DOMAIN) || '' }}
        run: npm run build

      - name: Build installer and portable exe
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: MAX-Upgrader-exe
          path: |
            release/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p files
          find artifacts -type f \( -name '*.apk' -o -name '*.exe' \) -exec cp {} files/ \;
          ls -la files

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: MAX Upgrader ${{ inputs.tag || github.ref_name }}
          files: files/*
          generate_release_notes: true
