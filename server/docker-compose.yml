services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maxup
      POSTGRES_PASSWORD: ${DB_PASSWORD:?нужен DB_PASSWORD}
      POSTGRES_DB: maxupgrader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxup -d maxupgrader"]
      interval: 10s
      timeout: 5s
      retries: 6

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://maxup:${DB_PASSWORD}@db:5432/maxupgrader
      JWT_SECRET: ${JWT_SECRET:?нужен JWT_SECRET}
      ADMIN_CODE: ${ADMIN_CODE:-}
      PORT: 3000
    expose:
      - "3000"
    ports:
      # только для локальной проверки с самого сервера
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # поднимается только с профилем https, то есть когда домен задан
    profiles: [https]
    depends_on:
      - server
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
